name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Build companion
        shell: pwsh
        run: |
          # -trimpath and -buildvcs=false: same bytes as a local build of the same commit.
          $v = (Select-String -Path internal/app/app.go -Pattern 'Version = "([^"]+)"').Matches[0].Groups[1].Value
          New-Item -ItemType Directory -Force dist | Out-Null
          go build -trimpath -buildvcs=false -ldflags "-H windowsgui -s -w" -o dist/ForeverPulseCompanion.exe ./cmd/forever-pulse-companion
          $got = (./dist/ForeverPulseCompanion.exe --version | Out-String).Trim()
          if ($got -ne $v) { throw "version $got, expected $v" }
          $info = [Diagnostics.FileVersionInfo]::GetVersionInfo("$PWD/dist/ForeverPulseCompanion.exe")
          if ($info.ProductVersion -ne $v) { throw "resource version $($info.ProductVersion), expected $($v): run outils/mkres" }
      - name: Build installer
        shell: pwsh
        run: ./outils/installateur/Build.ps1 -Exe dist/ForeverPulseCompanion.exe -OutDir dist
      - name: Test installer (no installation)
        shell: pwsh
        run: ./outils/installateur/Test.ps1 -Exe dist/ForeverPulseCompanion.exe -OutDir dist
      - name: Hashes
        shell: pwsh
        run: Get-FileHash dist/* -Algorithm SHA256 | Format-Table Hash, Path -AutoSize | Out-String -Width 300
      - uses: actions/upload-artifact@v4
        with:
          name: ForeverPulseCompanion
          path: |
            dist/ForeverPulseCompanion.exe
            dist/ForeverPulseCompanion.msi
            dist/ForeverPulseCompanion-Setup.exe
          if-no-files-found: error
      # After SignPath approval: sign ForeverPulseCompanion.exe, rebuild the MSI and
      # setup around the signed exe, then sign both (SignPath deep signing), with
      # signpath/github-action-submit-signing-request (organization id and API token
      # stored as repository secrets).
