name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.24.13'
          cache: false
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./... -count=1
      - name: Build
        shell: pwsh
        run: |
          $v = (Select-String -Path internal/app/app.go -Pattern 'Version = "([^"]+)"').Matches[0].Groups[1].Value
          go build -trimpath -ldflags "-H windowsgui -s -w" -o ForeverPulseCompanion.exe ./cmd/forever-pulse-companion
          $got = (./ForeverPulseCompanion.exe --version | Out-String).Trim()
          if ($got -ne $v) { throw "version $got, expected $v" }
          (Get-FileHash ForeverPulseCompanion.exe -Algorithm SHA256).Hash
      - uses: actions/upload-artifact@v4
        with:
          name: ForeverPulseCompanion
          path: ForeverPulseCompanion.exe
          if-no-files-found: error
      # After SignPath approval: submit the artifact above with
      # signpath/github-action-submit-signing-request (organization id and
      # API token stored as repository secrets), then attach the signed exe.
